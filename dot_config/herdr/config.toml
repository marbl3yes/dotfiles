onboarding = false

[theme.custom]
red = "#4e82ef"     # blocked, needs input
teal = "#4e82ef"    # done, not seen yet
yellow = "#a78bfa"  # working
active_row_bg = "#45475a"

[ui]
agent_panel_sort = "priority"
prompt_new_tab_name = false
status_indicators = "dots"
copy_on_select = false

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["tab"],
]

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["branch"],
]

[ui.sound]
enabled = false

[ui.toast]
delivery = "system"

[keys]
prefix = "§"
new_tab = ["prefix+c", "cmd+t"]
close_tab = ["prefix+shift+x", "cmd+w"]
goto = ["prefix+g", "cmd+k"]
previous_tab = "prefix+p"
next_tab = "prefix+n"
previous_workspace = "prefix+up"
next_workspace = "prefix+down"
cycle_pane_next = ["prefix+tab", "alt+up"]
cycle_pane_previous = ["prefix+shift+tab", "alt+down"]

# Lazygit over the focused pane. q closes it.
[[keys.command]]
key = ["cmd+shift+g", "prefix+d"]
type = "popup"
command = "cd \"${HERDR_ACTIVE_PANE_CWD:-.}\" && exec lazygit"
description = "Git status"
width = "90%"
height = "85%"

# Command palette ala VS Code
[[keys.command]]
key = "prefix+shift+p"
type = "plugin_action"
command = "vjeantet.palette.open"
description = "Command palette"

# File viewer inside herdr pane
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

# File viewer inside herdr new tab
[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer in tab"
